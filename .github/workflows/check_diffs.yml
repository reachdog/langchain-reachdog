name: Offline package checks
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './libs/reachdog[test]' build
      - run: python -m pytest libs/reachdog/tests
      - run: python -m build --wheel libs/reachdog
